workflows:
  appharbor-debug:
    name: AppHarbor Debug APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: feature/persistent-creator-discovery
          include: true
          source: true
    scripts:
      - name: Build and test
        script: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/**/*
