name: Development Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build AppHarbor development APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -tqq "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "$apk"
          version="$(awk -F'"' '/^val latestVersionName = / { print $2; exit }' app/build.gradle.kts)"
          test -n "$version"
          "$build_tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -q "name='com.omnify.vroot.debug'" apk-badging.txt
          grep -q "versionName='${version}.d'" apk-badging.txt
          grep -q "application-label:'AppHarbor Dev'" apk-badging.txt
          grep -E "^(package:|application-label:)" apk-badging.txt

      - name: Prepare durable development asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^val latestVersionName = / { print $2; exit }' app/build.gradle.kts)"
          test -n "$version"
          short_sha="${GITHUB_SHA:0:12}"
          source_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          apk="AppHarbor-dev-debug-v${version}-${short_sha}.apk"
          cp "$source_apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.asset.outputs.apk }}
          TAG: ${{ steps.asset.outputs.tag }}
          SHORT_SHA: ${{ steps.asset.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Development/debug build of AppHarbor from commit ${GITHUB_SHA}. This is an installable test build, not a production-signed release. Debug signing is CI-generated and may require uninstalling an older development build before installing a newer one."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh release edit "$TAG" --title "AppHarbor development ${SHORT_SHA}" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "AppHarbor development ${SHORT_SHA}" --notes "$notes" --prerelease
          fi
