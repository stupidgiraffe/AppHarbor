name: Development Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build AppHarbor development APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -tqq "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "$apk"
          version="$(awk -F'"' '/^val latestVersionName = / { print $2; exit }' app/build.gradle.kts)"
          test -n "$version"
          "$build_tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -q "name='com.omnify.vroot.debug'" apk-badging.txt
          grep -q "versionName='${version}.d'" apk-badging.txt
          grep -q "application-label:'AppHarbor Dev'" apk-badging.txt
          grep -E "^(package:|application-label:)" apk-badging.txt

      - name: Prepare development release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^val latestVersionName = / { print $2; exit }' app/build.gradle.kts)"
          test -n "$version"
          short_sha="${GITHUB_SHA:0:8}"
          source_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"

          apk="AppHarbor-v${version}-dev.apk"
          cp "$source_apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"

          cat > release-notes.md <<EOF
          # AppHarbor v${version} — Development Preview

          **Your Android app library, beyond the Play Store.**

          AppHarbor brings F-Droid repositories, GitHub, GitLab, Codeberg, Gitea, Forgejo, and independent Android projects into one place. Follow developers, discover their apps, keep a personal library, and update from the original source instead of hunting through release pages by hand.

          ## Highlights

          - Browse F-Droid-style repositories and independent forge releases together
          - Follow entire developer accounts or individual repositories
          - Discover Android releases from GitHub, GitLab, Codeberg, Gitea, and Forgejo
          - Resume interrupted creator scans with persisted background progress
          - Keep a personal catalog of interesting Android apps and their sources

          ## Install

          Download **${apk}** from **Assets** below and install it on Android.

          **Build info:** version ${version}.d · commit ${short_sha} · development channel

          > This preview is debug-signed for active development. If Android reports a signing conflict with an older debug build, uninstall that older debug build first.

          ## Verification

          A SHA-256 checksum is attached as **${apk}.sha256**.
          EOF

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish rolling GitHub development release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.release.outputs.apk }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: appharbor-dev
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
            gh release edit "$TAG"               --title "AppHarbor v${VERSION} — Development Preview"               --notes-file release-notes.md               --prerelease
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256"               --target "$GITHUB_SHA"               --title "AppHarbor v${VERSION} — Development Preview"               --notes-file release-notes.md               --prerelease
          fi
