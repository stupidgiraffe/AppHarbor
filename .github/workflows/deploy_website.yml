name: Deploy Website

# GitHub Pages is not enabled on this fork yet. Keep this workflow manual so
# website edits do not generate failed-action emails. Once Pages is enabled in
# Settings → Pages with GitHub Actions as the source, restore the push trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
